services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linguamentor
      POSTGRES_USER: linguamentor
      POSTGRES_PASSWORD: linguamentor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguamentor -d linguamentor"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5

  jwt-key-init:
    image: node:24-slim
    restart: "no"
    command:
      - node
      - -e
      - |
        const { generateKeyPairSync } = require('node:crypto');
        const { existsSync, writeFileSync } = require('node:fs');
        const privatePath = '/keys/jwt_private.pem';
        const publicPath = '/keys/jwt_public.pem';
        if (!existsSync(privatePath) || !existsSync(publicPath)) {
          const keys = generateKeyPairSync('rsa', {
            modulusLength: 2048,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });
          writeFileSync(privatePath, keys.privateKey, { mode: 0o600 });
          writeFileSync(publicPath, keys.publicKey, { mode: 0o644 });
        }
    volumes:
      - jwt-keys:/keys

  migrate:
    build: ../apps/ai-service
    restart: "no"
    environment:
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    # Root context, not ../apps/api-gateway — it depends on the workspace
    # package @lingumentor/shared-schemas, so the build needs to see the
    # whole monorepo, not just this one app's directory. See the Dockerfile.
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://linguamentor:linguamentor@postgres:5432/linguamentor
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: ./keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: ./keys/jwt_private.pem
      ENFORCE_CALIBRATION_GATE: "false"
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:3001
    volumes:
      - jwt-keys:/app/keys:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-key-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl/wget in node:24-slim (verified) — node's own http client is
      # already on PATH, so this avoids installing a package into the
      # runtime image just to run a health probe.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Single Node process (ADR 0001 §2.2), no LLM/DB-heavy work of its own —
    # the lightest of the three app containers.
    mem_limit: 512m
    cpus: 1.0

  ai-service:
    build: ../apps/ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: ./keys/jwt_public.pem
      GROQ_API_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jwt-keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-key-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Matches the HEALTHCHECK baked into apps/ai-service/Dockerfile —
      # declared explicitly here too so `depends_on: condition:
      # service_healthy` below has something to gate on without relying on
      # Compose picking up the image-level default.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Heaviest single container: async FastAPI + LLM request/response
    # payloads + its own asyncpg pool (db_pool_max_size=10) against Neon.
    mem_limit: 1024m
    cpus: 1.5

  worker:
    build: ../apps/worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    # No healthcheck: block here — worker has no HTTP surface to probe.
    # apps/worker/Dockerfile bakes in a process-liveness HEALTHCHECK
    # (checks /proc/1/cmdline for the worker process), which Compose picks
    # up automatically from the image; nothing currently depends on
    # worker's own health so there's no condition to gate here either.
    mem_limit: 768m
    cpus: 1.0

volumes:
  postgres-data:
  redis-data:
  jwt-keys:
