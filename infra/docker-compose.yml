services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linguamentor
      POSTGRES_USER: linguamentor
      POSTGRES_PASSWORD: linguamentor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguamentor -d linguamentor"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5

  jwt-key-init:
    image: node:24-slim
    restart: "no"
    command:
      - node
      - -e
      - |
        const { generateKeyPairSync } = require('node:crypto');
        const { existsSync, writeFileSync } = require('node:fs');
        const privatePath = '/keys/jwt_private.pem';
        const publicPath = '/keys/jwt_public.pem';
        if (!existsSync(privatePath) || !existsSync(publicPath)) {
          const keys = generateKeyPairSync('rsa', {
            modulusLength: 2048,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });
          writeFileSync(privatePath, keys.privateKey, { mode: 0o600 });
          writeFileSync(publicPath, keys.publicKey, { mode: 0o644 });
        }
    volumes:
      - jwt-keys:/keys

  migrate:
    build: ../apps/ai-service
    restart: "no"
    environment:
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    # Root context: the gateway depends on the workspace package @lingumentor/shared-schemas.
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://linguamentor:linguamentor@postgres:5432/linguamentor
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: ./keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: ./keys/jwt_private.pem
      ENFORCE_CALIBRATION_GATE: "false"
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:3001
    volumes:
      - jwt-keys:/app/keys:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-key-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node:24-slim has no curl or wget, so the probe uses Node's own http client.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  ai-service:
    build: ../apps/ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: ./keys/jwt_public.pem
      # Fixed replies, no key and no network: local runs and CI never call a real LLM.
      LLM_PROVIDER: fake
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jwt-keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-key-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image's own probe, at a shorter interval so the worker starts sooner.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1024m
    cpus: 1.5

  worker:
    build: ../apps/worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://linguamentor:linguamentor@postgres:5432/linguamentor
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    # No HTTP surface to probe; the image's own healthcheck watches the process.
    mem_limit: 768m
    cpus: 1.0

  web:
    # Root context: frontend depends on @lingumentor/shared-schemas.
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        # The browser runs on the host, so this is localhost, not "api-gateway".
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_WS_VOICE_URL: ws://localhost:3000/voice
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # node:24-slim has no curl/wget; same probe style as api-gateway.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres-data:
  redis-data:
  jwt-keys:
