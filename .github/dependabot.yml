version: 2

# Version updates only; security fix PRs come from the repo's Dependabot settings, and CI's dependency review blocks new advisories.
updates:
  # The root lockfile covers the whole pnpm workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR a week for small bumps, so it actually gets read.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors are planned migrations; security updates still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      # The PR title becomes the squash commit, and CI's title check wants a scope.
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/apps/ai-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Base images carry OS fixes that no package scanner sees.
  - package-ecosystem: "docker"
    directories:
      - "/apps/api-gateway"
      - "/apps/ai-service"
      - "/apps/worker"
    schedule:
      interval: "weekly"
    ignore:
      # Runtimes move with .nvmrc and .python-version; for Python, 3.12 to 3.14 is a "minor".
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
