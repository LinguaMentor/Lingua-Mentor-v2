name: CI - security
on:
  # Called by ci.yml on every PR (never path-filtered: a secret can land in
  # any file).
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — the default shallow clone would only expose the tip
      # commit, and the whole point is catching a secret introduced in an
      # earlier commit and later "removed" in a follow-up. Deleting a secret
      # in a subsequent commit does not remove it from history; the credential
      # stays readable and stays compromised until it's rotated.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release binary, not gitleaks-action, which needs a paid licence for repos in an organisation.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          # From the release's gitleaks_8.21.2_checksums.txt; pinned here, since whoever can swap the binary can swap that file.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSLf -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact: findings are printed to a CI log that is readable by anyone
      # who can see the repo. An unredacted report would take a secret that
      # leaked into git history and additionally publish it in plaintext to
      # the build log — turning detection into a second disclosure.
      #
      # Scans full history on every run. That's ~200ms at this repo's size;
      # if it ever gets slow enough to notice, scope it with --log-opts to
      # the PR range rather than dropping the check.
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose
