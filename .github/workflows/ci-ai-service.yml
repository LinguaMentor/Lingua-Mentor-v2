name: CI - ai-service
on:
  # Runs only when called, by ci.yml on pull requests (with per-service path
  # filtering inside the workflow).
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7

      # Reads .python-version at the repo root — same single-source rule the
      # Node workflows follow with .nvmrc. Matches the python:3.12-slim base
      # image in this service's Dockerfile.
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version-file: ".python-version"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.1" # matches the sandbox's verified poetry version
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Caches downloaded packages, not the venv: restored venvs came back with
      # unrunnable tools (mypy "Command not found"), while fresh installs always work.
      - name: Cache Poetry downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: ai-service-poetry-dl-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('apps/ai-service/poetry.lock') }}
          restore-keys: |
            ai-service-poetry-dl-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-

      # --no-root: this project has no [project]/packages layout for
      # poetry's package mode (it's run via `uvicorn app.main:app`, not
      # imported as an installed package) — installing the root package
      # fails with "No file/folder found for package ai-service" without
      # this flag. The Dockerfile already installs the same way.
      - run: poetry install --no-root --sync

      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest -q --cov --cov-report=term --cov-report=html

      # Report only for now: no threshold until there is a baseline.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ai-service
          path: apps/ai-service/coverage/
          retention-days: 14
