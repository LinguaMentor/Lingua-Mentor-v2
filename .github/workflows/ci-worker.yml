name: CI - worker
on:
  # Runs only when called, by ci.yml on pull requests (with per-service path
  # filtering inside the workflow).
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7

      # Reads .python-version at the repo root — see ci-ai-service.yml.
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version-file: ".python-version"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Caches downloaded packages, not the venv: restored venvs came back with
      # unrunnable tools (mypy "Command not found"), while fresh installs always work.
      - name: Cache Poetry downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: worker-poetry-dl-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('apps/worker/poetry.lock') }}
          restore-keys: |
            worker-poetry-dl-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-

      # --no-root: same package-mode caveat as ai-service — worker is run
      # as `python -m app.main`, not installed as a package.
      - run: poetry install --no-root --sync

      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest -q
