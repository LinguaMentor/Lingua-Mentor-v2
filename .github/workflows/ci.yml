name: CI
on:
  # No `paths:` here: a path-filtered required check never reports on other
  # PRs and leaves them stuck on "Expected". The `changes` job filters instead.
  pull_request:
    # `edited` re-runs everything, so a title fix can't turn a red gate green.
    types: [opened, synchronize, reopened, edited]

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# paths-filter lists changed files through the API (pull-requests: read);
# pr-ticket looks up the linked issue (issues: read); the called workflows only check out code.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      # Toolchain and CI files count too, so changing how a service is built
      # re-verifies it even when none of its source changed.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            node-root: &node-root
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".nvmrc"
              - ".prettierrc.json"
              - ".prettierignore"
              - ".github/workflows/ci.yml"
            api-gateway:
              - *node-root
              - "apps/api-gateway/**"
              - "packages/**"
              - ".github/workflows/ci-api-gateway.yml"
            frontend:
              - *node-root
              - "apps/frontend/**"
              - "packages/**"
              - ".github/workflows/ci-frontend.yml"
            ai-service:
              - "apps/ai-service/**"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/ci-ai-service.yml"
            worker:
              - "apps/worker/**"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/ci-worker.yml"

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/ci-api-gateway.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    uses: ./.github/workflows/ci-ai-service.yml

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/ci-worker.yml

  # Never path-filtered: a secret can land in any file.
  security:
    uses: ./.github/workflows/ci-security.yml

  # Squash merges use the PR title as the commit on main, so the title is what gets validated.
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            frontend
            api
            ai
            infra
            tests
            docs
            ops
            deps
            release
          requireScope: false
          # 120, not 72: Dependabot's grouped titles ("... across 1 directory") run long.
          subjectPattern: ^(?![A-Z]).{1,120}$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and stay under 120 characters.

  # Branch names and ticket references, which GitHub can't enforce on the Free plan.
  pr-ticket:
    name: PR ticket
    # Dependabot has no ticket; the sprint release PR (develop -> main) covers many.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !(github.head_ref == 'develop' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check branch name, ticket reference and closing keywords
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$HEAD_REF" =~ ^([0-9]+)-[a-z0-9][a-z0-9-]*$ ]] \
            || fail "Branch '$HEAD_REF' must be <issue number>-<short-name>, e.g. 123-password-reset."
          issue="${BASH_REMATCH[1]}"
          grep -Eiq "(^|[^a-z])(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#|gh-|[a-z0-9_.-]+/[a-z0-9_.-]+#|https?://github\.com/[^ ]+/issues/)[0-9]+" <<<"$PR_BODY" \
            && fail "Use 'Refs #$issue', not Closes/Fixes/Resolves: those close the ticket at merge and skip QA."
          grep -Eq "Refs #$issue([^0-9]|$)" <<<"$PR_BODY" \
            || fail "The PR description must contain 'Refs #$issue' to match the branch name."
          state="$(gh issue view "$issue" --json state --jq .state 2>/dev/null)" \
            || fail "Issue #$issue does not exist in this repository."
          [[ "$state" == "OPEN" ]] || fail "Issue #$issue is closed. Reopen it or reference the right ticket."
          echo "Linked to open issue #$issue."

  # The only check the ruleset should require. Skipped (service untouched)
  # passes; any failure or cancellation, `changes` included, fails it.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, api-gateway, frontend, ai-service, worker, security, pr-title, pr-ticket]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Upstream results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All affected services passed."
