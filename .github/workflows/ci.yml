name: CI
on:
  # No `paths:` here: a path-filtered required check never reports on other
  # PRs and leaves them stuck on "Expected". The `changes` job filters instead.
  pull_request:
    # `edited` re-runs everything, so a title fix can't turn a red gate green.
    types: [opened, synchronize, reopened, edited]

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# paths-filter lists changed files through the API (pull-requests: read);
# pr-ticket looks up the linked issue (issues: read); the called workflows only check out code.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      worker: ${{ steps.filter.outputs.worker }}
      local-compose: ${{ steps.filter.outputs.local-compose }}
      e2e: ${{ steps.filter.outputs.e2e }}
      staging-compose: ${{ steps.filter.outputs.staging-compose }}
      smoke-test: ${{ steps.filter.outputs.smoke-test }}
      staging-deploy: ${{ steps.filter.outputs.staging-deploy }}
      monitoring-backup: ${{ steps.filter.outputs.monitoring-backup }}
      database-backup: ${{ steps.filter.outputs.database-backup }}
    steps:
      # Toolchain and CI files count too, so changing how a service is built
      # re-verifies it even when none of its source changed.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            node-root: &node-root
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".nvmrc"
              - ".prettierrc.json"
              - ".prettierignore"
              - ".github/workflows/ci.yml"
            api-gateway:
              - *node-root
              - "apps/api-gateway/**"
              - "packages/**"
              - ".github/workflows/ci-api-gateway.yml"
              - ".github/workflows/ci-image.yml"
              - ".dockerignore"
            frontend:
              - *node-root
              - "apps/frontend/**"
              - "packages/**"
              - ".github/workflows/ci-frontend.yml"
              - ".github/workflows/ci-image.yml"
              - ".dockerignore"
            ai-service:
              - "apps/ai-service/**"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/ci-ai-service.yml"
              - ".github/workflows/ci-image.yml"
            worker:
              - "apps/worker/**"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/ci-worker.yml"
              - ".github/workflows/ci-image.yml"
            local-compose: &local-stack
              - "infra/docker-compose.yml"
              - "scripts/test-local-compose.sh"
              - "apps/api-gateway/**"
              - "apps/ai-service/**"
              - "apps/worker/**"
              - "apps/frontend/**"
              - "packages/shared-schemas/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".dockerignore"
              - ".github/workflows/ci.yml"
            e2e:
              - *local-stack
              - "e2e/**"
            staging-compose:
              - "infra/staging/docker-compose.yml"
              - ".github/workflows/ci.yml"
            smoke-test:
              - "scripts/smoke-test*.mjs"
              - "scripts/post-deploy-check*.mjs"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
            staging-deploy:
              - "infra/staging/deploy.sh"
              - "infra/staging/docker-compose.yml"
              - "scripts/test-staging-deploy.sh"
              - ".github/workflows/**"
            monitoring-backup:
              - "infra/monitoring/**"
              - "scripts/test-monitoring-backup.sh"
              - ".github/workflows/ci.yml"
            database-backup:
              - "scripts/*-database*.sh"
              - "scripts/restore-drill.sh"
              - "scripts/install-rclone.sh"
              - "infra/monitoring/setup.sh"
              - ".github/workflows/backup-database.yml"
              - ".github/workflows/ci.yml"

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/ci-api-gateway.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    uses: ./.github/workflows/ci-ai-service.yml

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/ci-worker.yml

  # Arm image builds, never pushed.
  image-api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/ci-image.yml
    with:
      app: api-gateway
      context: .
      dockerfile: apps/api-gateway/Dockerfile

  image-ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    uses: ./.github/workflows/ci-image.yml
    with:
      app: ai-service
      context: apps/ai-service
      dockerfile: apps/ai-service/Dockerfile

  image-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/ci-image.yml
    with:
      app: worker
      context: apps/worker
      dockerfile: apps/worker/Dockerfile

  image-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-image.yml
    with:
      app: frontend
      context: .
      dockerfile: apps/frontend/Dockerfile

  local-compose:
    needs: changes
    if: needs.changes.outputs.local-compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run local Compose smoke test
        run: bash scripts/test-local-compose.sh

  # The user journeys, in a real browser against the whole local stack with the fake LLM.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # corepack before the cached setup-node, which needs pnpm on PATH to find its store.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --filter e2e
      - run: pnpm exec prettier --check e2e
      - run: pnpm --filter e2e typecheck
      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Start the local stack
        run: docker compose -f infra/docker-compose.yml up --build -d --wait --wait-timeout 180
      - name: Run the journeys
        run: pnpm --filter e2e test
      - name: Save the container logs
        if: failure()
        run: mkdir -p e2e/test-results && docker compose -f infra/docker-compose.yml logs --no-color > e2e/test-results/compose.log 2>&1
      - name: Upload the traces, screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  staging-compose:
    needs: changes
    if: needs.changes.outputs.staging-compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate staging Compose file
        env:
          API_GATEWAY_IMAGE: placeholder:api-gateway
          AI_SERVICE_IMAGE: placeholder:ai-service
          WORKER_IMAGE: placeholder:worker
          WEB_IMAGE: placeholder:web
        run: docker compose -f infra/staging/docker-compose.yml config --quiet

  smoke-test:
    needs: changes
    if: needs.changes.outputs.smoke-test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      # Listed by name: the smoke test script itself matches Node's test-file pattern.
      - name: Test the smoke test and the post-deploy check
        run: node --test scripts/smoke-test.test.mjs scripts/post-deploy-check.test.mjs

  # The deploy runs unattended against a server, so its script and workflow are tested like code.
  staging-deploy:
    needs: changes
    if: needs.changes.outputs.staging-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the deploy script and its test
        run: shellcheck infra/staging/deploy.sh scripts/test-staging-deploy.sh
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Run the deploy script against a copy of the staging stack
        run: bash scripts/test-staging-deploy.sh

  # The monitoring server's backup and its heartbeat run unattended at night, so they are tested like code.
  monitoring-backup:
    needs: changes
    if: needs.changes.outputs.monitoring-backup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the monitoring scripts
        run: shellcheck infra/monitoring/*.sh scripts/test-monitoring-backup.sh
      - name: Run the backup script against stubs and a stand-in Grafana
        run: bash scripts/test-monitoring-backup.sh

  # The nightly database backup and its restore run unattended, so they are tested against a real Postgres 18.
  database-backup:
    needs: changes
    if: needs.changes.outputs.database-backup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the backup and restore scripts
        run: shellcheck scripts/*-database*.sh scripts/restore-drill.sh scripts/install-rclone.sh
      - name: Install the pinned rclone
        run: bash scripts/install-rclone.sh
      - name: Back up, restore and drill against a throwaway Postgres 18
        run: bash scripts/test-database-backup.sh

  # Never path-filtered: a secret can land in any file.
  security:
    uses: ./.github/workflows/ci-security.yml

  # Squash merges use the PR title as the commit on main, so the title is what gets validated.
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            frontend
            api
            ai
            infra
            tests
            docs
            ops
            deps
            release
          requireScope: false
          # 120, not 72: Dependabot's grouped titles ("... across 1 directory") run long.
          subjectPattern: ^(?![A-Z]).{1,120}$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and stay under 120 characters.

  # Branch names and ticket references, which GitHub can't enforce on the Free plan.
  pr-ticket:
    name: PR ticket
    # Dependabot has no ticket; the sprint release PR (develop -> main) covers many.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !(github.head_ref == 'develop' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check branch name, ticket reference and closing keywords
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$HEAD_REF" =~ ^(feature|bug|task|refactor|spike)/([0-9]+)-[a-z0-9][a-z0-9-]*$ ]] \
            || fail "Branch '$HEAD_REF' must be <type>/<issue number>-<title-slug>, e.g. feature/123-password-reset (type: feature, bug, task, refactor or spike)."
          issue="${BASH_REMATCH[2]}"
          grep -Eiq "(^|[^a-z])(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#|gh-|[a-z0-9_.-]+/[a-z0-9_.-]+#|https?://github\.com/[^ ]+/issues/)[0-9]+" <<<"$PR_BODY" \
            && fail "Use 'Refs #$issue', not Closes/Fixes/Resolves: those close the ticket at merge and skip QA."
          grep -Eq "Refs #$issue([^0-9]|$)" <<<"$PR_BODY" \
            || fail "The PR description must contain 'Refs #$issue' to match the branch name."
          # Issues and PRs share one number space; only a PR's payload has a pull_request key.
          item="$(gh api "repos/$GH_REPO/issues/$issue" --jq '[.state, has("pull_request")] | @tsv' 2>/dev/null)" \
            || fail "Issue #$issue does not exist in this repository."
          read -r state is_pr <<<"$item"
          [[ "$is_pr" == "false" ]] || fail "#$issue is a pull request, not a ticket. Reference the ticket this work belongs to."
          [[ "$state" == "open" ]] || fail "Issue #$issue is closed. Reopen it or reference the right ticket."
          echo "Linked to open issue #$issue."

  # The only check the ruleset should require. Skipped (service untouched)
  # passes; any failure or cancellation, `changes` included, fails it.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      [
        changes,
        api-gateway,
        frontend,
        ai-service,
        worker,
        image-api-gateway,
        image-ai-service,
        image-worker,
        image-frontend,
        local-compose,
        e2e,
        staging-compose,
        smoke-test,
        staging-deploy,
        monitoring-backup,
        database-backup,
        security,
        pr-title,
        pr-ticket,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Upstream results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All affected services passed."
