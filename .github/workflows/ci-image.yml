name: CI - image
on:
  workflow_call:
    inputs:
      app:
        description: App name, also the cache scope
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      dockerfile:
        description: Dockerfile path
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Image
    # Servers are Arm; a native runner avoids slow emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: false
          # The staging deploy builds with the same scopes, so each warms the other's cache.
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
