name: CI - api-gateway
on:
  # Runs only when called: ci.yml on pull requests (with per-service path
  # filtering inside the workflow) and deploy.yml on every push to main.
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node-version-file, not a literal — see ci-frontend.yml for why.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # --filter api-gateway... : matches the Dockerfile's own install
      # filter — pulls in @lingumentor/shared-schemas, the workspace
      # dependency api-gateway needs built before it can typecheck/build.
      - run: pnpm install --frozen-lockfile --filter api-gateway...

      # packages/ is checked here only, so frontend's job doesn't repeat it.
      - run: pnpm exec prettier --check apps/api-gateway packages

      - run: pnpm --filter @lingumentor/shared-schemas build
      - run: pnpm --filter api-gateway typecheck

      - run: pnpm --filter api-gateway lint
      - run: pnpm --filter api-gateway test
      - run: pnpm --filter api-gateway build
