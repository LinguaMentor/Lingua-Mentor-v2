name: Bug
description: "Something behaves differently from what it should."
title: "<What is wrong>, <where>"
type: Bug
body:
  - type: markdown
    attributes:
      value: "Write this so the assignee can start without reading any other document. Say what must be true and why, and leave how and where in the code to the engineer. State decisions already made as constraints. Never paste learner data, secrets, prices, scoring prompts or PRD text: this repository is public."
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "What is wrong, in one or two sentences."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Where it happens"
      options:
        - production
        - staging
        - local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Request ID, release, device, logs. Never learner data."
  - type: textarea
    id: suspected-cause
    attributes:
      label: "Suspected cause"
      description: "Optional: what you think goes wrong, and why."
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "Checks someone else can run and agree on."
      value: |
        - [ ] Cause written on this ticket
        - [ ] A test fails before the fix and passes after
        - [ ] QA confirms on staging
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: "Definition of Done"
      description: "The closing checklist, adjusted for the ticket type."
      value: |
        - [ ] Every acceptance criterion passes on staging (until staging exists: locally or from CI evidence, stated on the ticket)
        - [ ] Tests added or updated, and CI is green
        - [ ] PR reviewed, approved and squash-merged into `develop`
        - [ ] Docs and READMEs updated in the same PR
        - [ ] No new errors in the staging logs or error tracking after the deploy
        - [ ] QA has verified it and moved it to Done
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: "Test plan"
      description: "A numbered list of scenarios, each with its expected result and whether it is manual or automated. QA completes it during refinement."
      value: |
        1. Scenario. Expected: ... (manual or automated)
