name: Bug
description: "Something behaves differently from what it should."
title: "<What is wrong>, <where>"
type: Bug
body:
  - type: markdown
    attributes:
      value: "Write this so a teammate can do the work without reading any other document: current state, decisions already made, exact specification, how to check it. Never paste learner data, secrets, prices, scoring prompts or PRD text: this repository is public."
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "What is wrong, in one or two sentences."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Where it happens"
      options:
        - production
        - staging
        - local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Request ID, release, device, logs. Never learner data."
  - type: textarea
    id: suspected-cause
    attributes:
      label: "Suspected cause"
      description: "Optional: where you think it goes wrong, and why."
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "Things someone else can check, one per line."
      value: |
        - [ ] Cause written on this ticket
        - [ ] A test fails before the fix and passes after
        - [ ] QA confirms on staging
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: "Test plan"
      description: "QA completes this during refinement."
      value: |
        | # | Scenario | Expected result | Manual or automated |
        |---|---|---|---|
        | | | | |
