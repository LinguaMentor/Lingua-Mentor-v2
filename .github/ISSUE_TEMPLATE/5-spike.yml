name: Spike
description: "A time-boxed investigation that ends in an answer."
title: "Spike: <question>?"
type: Spike
body:
  - type: markdown
    attributes:
      value: "Write this so the assignee can start without reading any other document. Say what must be true and why, and leave how and where in the code to the engineer. State decisions already made as constraints. Never paste learner data, secrets, prices, scoring prompts or PRD text: this repository is public."
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "The question and why it matters now."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: "Background"
      description: "The situation today in terms of behaviour, the decisions already made and why, and the facts and numbers the work depends on."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: "Out of scope"
  - type: textarea
    id: questions
    attributes:
      label: "Questions to answer"
      description: "Each with what counts as a pass."
      value: |
        1. Question:
           Passes if:
    validations:
      required: true
  - type: dropdown
    id: time-box
    attributes:
      label: "Time box"
      options:
        - half a day
        - 1 day
        - 2 days
        - 3 days
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: "Deliverable"
      description: "What exists at the end, e.g. a comment on this ticket, a decision record, a prototype branch."
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: "Definition of Done"
      description: "The closing checklist, adjusted for the ticket type."
      value: |
        - [ ] Every question is answered with evidence
        - [ ] Recommendations are written on the ticket
        - [ ] Follow-up tickets are created
        - [ ] Tokens and test accounts used are cleaned up
        - [ ] Results reviewed by the tech lead
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Blocked by, blocks, related."
      value: |
        Blocked by: #
        Blocks: #
        Related: #
