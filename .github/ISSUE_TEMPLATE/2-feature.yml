name: Feature (story)
description: A user-facing capability with acceptance criteria, traced to the PRD.
title: "[area] Verb + object"
type: Feature
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on the outcome the user gets.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      value: "As a <learner type>, I want <capability>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: PRD or Calibration Brief section, parent epic, related decisions.
      placeholder: "PRD §8.5 · Parent #… · Decision #…"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        In scope:
        -
        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered, Given / When / Then. Cover every exam level the ticket touches (e.g. A1 to C2). No level is skipped on an assumption.
      value: |
        AC-1  Given … When … Then …
        AC-2  Given … When … Then …
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Filled at refinement by Tech Lead, Backend, Frontend or AI/ML. Approach, API changes, data or migration changes, config.
  - type: textarea
    id: nfr
    attributes:
      label: Non-functional requirements
      value: |
        Performance:
        Security and privacy:
        Accessibility:
        AI cost:
        Analytics events:
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Filled by QA before the ticket moves to Ready. Scenarios, test data, levels covered, environment (staging).
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Blocked by #… · Blocks #…"
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: Every acceptance criterion passes on staging (QA)
        - label: Tests added (unit, plus integration and end-to-end where relevant)
        - label: CI gate green, PR squash-merged with a conventional-commit title
        - label: Docs and READMEs updated in the same PR
        - label: Security, privacy and analytics notes addressed
