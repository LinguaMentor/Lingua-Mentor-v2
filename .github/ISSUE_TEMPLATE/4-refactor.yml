name: Refactor
description: "Restructuring code without changing what it does."
title: "<Verb> <what>"
type: Refactor
body:
  - type: markdown
    attributes:
      value: "Write this so a teammate can do the work without reading any other document: current state, decisions already made, exact specification, how to check it. Never paste learner data, secrets, prices, scoring prompts or PRD text: this repository is public."
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "What gets restructured and why, in one or two sentences."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: "Background"
      description: "Current state with file paths, decisions already made and why."
    validations:
      required: true
  - type: textarea
    id: unchanged
    attributes:
      label: "Behaviour that must not change"
      description: "The observable behaviour the tests and QA must still see afterwards."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What is in scope and what is not."
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: "Specification"
      description: "Approach, files to change, API endpoints (method, route, payload), data and migrations, config. Points of attention: security, performance, compatibility."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "Things someone else can check, one per line."
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: "Test plan"
      description: "QA completes this during refinement."
      value: |
        | # | Scenario | Expected result | Manual or automated |
        |---|---|---|---|
        | | | | |
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Tickets that must land first, or that wait on this one."
      value: |
        Blocked by: #
        Blocks: #
        Related: #
  - type: textarea
    id: risks
    attributes:
      label: "Risks and gotchas"
      description: "Risks and their mitigation, open questions, and traps a newcomer would fall into."
