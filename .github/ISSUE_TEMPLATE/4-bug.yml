name: Bug
description: Behaviour that breaks a stated requirement or something already released.
title: "[area] What is wrong, and where"
type: Bug
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Also add the matching severity label at triage. An S1 in production is always P0.
      options:
        - "S1: outage, data loss, security breach, or a wrong score shown to a learner"
        - "S2: a core journey broken, no workaround"
        - "S3: degraded behaviour with a workaround"
        - "S4: cosmetic or minor"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - staging
        - production
        - local
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.4.0 or abc1234"
  - type: input
    id: origin
    attributes:
      label: Found by and originating ticket
      placeholder: "QA during #… / monitoring / learner report"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, request ID. Never paste secrets or learner essays.
  - type: textarea
    id: frequency
    attributes:
      label: Frequency and workaround
  - type: checkboxes
    id: fix-criteria
    attributes:
      label: Fix acceptance criteria
      options:
        - label: Root cause identified and noted on this issue
        - label: Regression test added that fails before the fix and passes after
        - label: Verified by QA on staging
